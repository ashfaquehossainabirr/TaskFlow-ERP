<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary Meta Tags -->
    <title>TaskFlow — Project &amp; Task Management</title>
    <meta name="description" content="A simple and powerful task management solution for teams." />
    <meta name="keywords" content="task management, project management, team collaboration" />
    <meta name="author" content="Ashfaque Hossain Abir" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://task-flow-app-two-alpha.vercel.app" />
    <meta property="og:title" content="TaskFlow — Project &amp; Task Management" />
    <meta property="og:description" content="A simple and powerful task management solution for teams." />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Runs before React mounts so there's no flash of the wrong theme on load.
      (function () {
        try {
          var stored = localStorage.getItem('taskflow_theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage can throw in some privacy modes - dark is the app's default anyway.
        }
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>

    <div id="tf-boot" aria-hidden="true">
      <div class="tf-boot-mark">
        <span class="tf-boot-ring"></span>
        <span class="tf-boot-ring tf-boot-ring--2"></span>
        <span class="tf-boot-logo">T</span>
      </div>
      <div class="tf-boot-word">TaskFlow</div>
      <div class="tf-boot-bar"><span></span></div>
    </div>

    <style>
      #tf-boot {
        --tf-cyan: #4fd8e0;
        --tf-cyan-dim: rgba(79, 216, 224, 0.25);
        --tf-blue: #4a9eff;
        --tf-blue-dim: rgba(74, 158, 255, 0.55);
        --tf-blue-faint: rgba(74, 158, 255, 0.15);
        --tf-logo-text: #0b1017;
        --tf-bar-track: rgba(148, 167, 184, 0.2);

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--tf-boot-bg, #0b1017);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #tf-boot.tf-boot-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      html[data-theme='light'] #tf-boot {
        --tf-boot-bg: #f4f6f8;
        /* Light mode uses the app's actual light-theme accent shades (deeper,
           more saturated) instead of the dark-theme neon cyan/blue, which
           washes out against a light background. */
        --tf-cyan: #0891a3;
        --tf-cyan-dim: rgba(8, 145, 163, 0.3);
        --tf-blue: #2f6fd6;
        --tf-blue-dim: rgba(47, 111, 214, 0.6);
        --tf-blue-faint: rgba(47, 111, 214, 0.2);
        --tf-logo-text: #ffffff;
        --tf-bar-track: rgba(77, 92, 106, 0.18);
      }
      .tf-boot-mark {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tf-boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--tf-cyan);
        border-right-color: var(--tf-cyan-dim);
        animation: tf-boot-spin 1.1s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite;
      }
      .tf-boot-ring--2 {
        inset: -10px;
        border-top-color: transparent;
        border-right-color: transparent;
        border-bottom-color: var(--tf-blue-dim);
        border-left-color: var(--tf-blue-faint);
        animation-duration: 1.7s;
        animation-direction: reverse;
      }
      .tf-boot-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--tf-cyan), var(--tf-blue));
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 17px;
        color: var(--tf-logo-text);
        box-shadow: 0 0 24px -4px var(--tf-cyan-dim);
        animation: tf-boot-pulse 1.8s ease-in-out infinite;
      }
      html[data-theme='light'] .tf-boot-logo {
        box-shadow: 0 4px 18px -4px rgba(23, 31, 39, 0.35);
      }
      .tf-boot-word {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.01em;
        color: #eaf0f5;
        opacity: 0;
        animation: tf-boot-word-in 0.6s ease 0.15s forwards;
      }
      html[data-theme='light'] .tf-boot-word {
        color: #171f27;
      }
      .tf-boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: var(--tf-bar-track);
        overflow: hidden;
      }
      .tf-boot-bar span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--tf-cyan), var(--tf-blue));
        animation: tf-boot-bar-sweep 1.15s ease-in-out infinite;
      }
      @keyframes tf-boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes tf-boot-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes tf-boot-word-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes tf-boot-bar-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .tf-boot-ring,
        .tf-boot-logo,
        .tf-boot-bar span {
          animation-duration: 2.4s;
        }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
